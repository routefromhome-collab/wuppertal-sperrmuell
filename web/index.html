<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>Шпера Wuppertal</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top__row">
        <h1 class="top__title">🗑 Шпера <button id="adminBtn" class="icon-btn icon-btn--sm" type="button" hidden aria-label="Публикация в канал" title="Публикация в канал">📣</button></h1>
        <div class="datepick">
          <button id="prev" class="icon-btn" type="button" aria-label="Сдвинуть на день назад">‹</button>
          <input id="date" type="date" aria-label="Первый день списка">
          <button id="next" class="icon-btn" type="button" aria-label="Сдвинуть на день вперёд">›</button>
        </div>
      </div>
      <nav id="days" class="days" aria-label="7 дней от выбранной даты"></nav>
    </header>

    <div id="banner" class="banner" role="status" hidden></div>

    <main class="main">
      <div id="map" aria-label="Карта улиц"></div>

      <section id="sheet" class="sheet" data-snap="mid" aria-label="Список улиц">
        <button id="sheetToggle" class="sheet__head" type="button" aria-expanded="true" aria-controls="list" aria-label="Список улиц: потяните вверх или вниз">
          <span class="sheet__grip" aria-hidden="true"></span>
          <span id="sheetTitle" class="sheet__title">Загрузка…</span>
          <span id="sheetSub" class="sheet__sub"></span>
        </button>
        <div class="sheet__tools">
          <input id="search" type="search" placeholder="Поиск улицы" aria-label="Поиск улицы" autocomplete="off">
          <button id="nearest" class="btn" type="button">📍 Рядом</button>
          <button id="routeBtn" class="btn btn--primary" type="button">🗺 Маршрут</button>
        </div>
        <ul id="list" class="list"></ul>
      </section>
    </main>

    <dialog id="adminDlg" class="dlg dlg--wide">
      <div class="dlg__head">
        <h2 class="dlg__title">📣 Админ-панель</h2>
        <button id="adminClose" class="icon-btn" type="button" aria-label="Закрыть">✕</button>
      </div>
      <details id="adminData" class="adm-data">
        <summary id="adminDataSummary">Данные расписания</summary>
        <p id="adminDataInfo" class="dlg__text"></p>
        <p id="adminRunInfo" class="dlg__text" role="status"></p>
        <div id="adminUpdateBox" hidden>
          <label class="dlg__check"><input id="adminQuick" type="checkbox"> Пробный прогон: только 20 улиц</label>
          <label class="dlg__check"><input id="adminForce" type="checkbox"> Перезапросить всё, не глядя на возраст записей</label>
          <button id="adminUpdate" class="btn" type="button">🔄 Обновить данные AWG</button>
        </div>
        <p id="adminUpdateHint" class="dlg__text" hidden>Запуск обновления из приложения не настроен: нужен секрет GH_TOKEN в Worker (см. README). Пока запускайте Actions → Update schedule.</p>
      </details>
      <details id="adminTeam" class="adm-data">
        <summary id="adminTeamSummary">Админы</summary>
        <ul id="adminTeamList" class="adm"></ul>
        <form id="adminTeamForm" class="dlg__row" autocomplete="off">
          <input id="adminTeamId" inputmode="numeric" pattern="[0-9]{5,15}" placeholder="Telegram ID нового админа" aria-label="Telegram ID нового админа">
          <button id="adminTeamAdd" class="btn" type="submit">Добавить</button>
        </form>
        <p id="adminTeamHint" class="dlg__text"></p>
      </details>
      <p id="adminHint" class="dlg__text"></p>
      <ul id="adminList" class="adm"></ul>
      <p id="adminStatus" class="dlg__text" role="status"></p>
      <div class="dlg__row">
        <button id="adminReload" class="btn" type="button">Обновить список</button>
        <button id="adminTest" class="btn" type="button">🧪 Тест себе</button>
        <button id="adminSend" class="btn btn--primary" type="button">Отправить в канал</button>
      </div>
    </dialog>

    <dialog id="routeDlg" class="dlg">
      <form method="dialog">
        <h2 class="dlg__title">Маршрут</h2>
        <p id="routeInfo" class="dlg__text"></p>
        <label class="dlg__check"><input id="routeFromMe" type="checkbox"> Начать от моего местоположения</label>
        <div id="routeLinks" class="dlg__links"></div>
        <button class="btn" value="close">Закрыть</button>
      </form>
    </dialog>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
