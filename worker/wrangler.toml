name = "sperrmuell-admin"
main = "src/index.js"
compatibility_date = "2025-01-01"

# Публичные настройки. Замените на свои значения.
[vars]
# откуда Worker берёт расписание (GitHub Pages, каталог web/data)
DATA_BASE_URL = "https://routefromhome-collab.github.io/wuppertal-sperrmuell/data"
# источник страницы приложения (без пути и без слеша в конце): единственный разрешённый CORS-источник
ALLOWED_ORIGIN = "https://routefromhome-collab.github.io"
# публичная карта дня для строки «Полная карта» в посте. Пусто = web/map.html рядом с DATA_BASE_URL.
# Это обычная страница сайта, не Mini App: ссылка из канала открывается в любом браузере.
MAP_URL = ""
# репозиторий, где запускается workflow «Update schedule» из панели админа
GITHUB_REPO = "routefromhome-collab/wuppertal-sperrmuell"

# Секреты задаются командой `npx wrangler secret put <ИМЯ>`, в репозиторий они не попадают:
#   BOT_TOKEN       токен бота (бот должен быть админом канала с правом публикации)
#   CHANNEL_ID      @schwebezeit или числовой id канала
#   ADMIN_IDS       Telegram ID админов через запятую (узнать свой ID: @userinfobot)
#   ADMIN_CHAT_ID   чат админа: сюда идёт «Тест» из панели и уведомления «кто что опубликовал»
#   GH_TOKEN        (необязательно) токен GitHub для кнопки «Обновить данные AWG» в панели:
#                   fine-grained token только на этот репозиторий, право «Actions: Read and write»

# (необязательно) KV для защиты от двойной отправки:
#   npx wrangler kv namespace create STATE   и вставьте id ниже
# [[kv_namespaces]]
# binding = "STATE"
# id = "<id>"
